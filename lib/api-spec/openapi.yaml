openapi: 3.1.0
info:
  title: Api
  version: 0.2.0
  description: Neo FMC - Multi-tenant Microfinance SaaS API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
  - name: auth
  - name: tenants
  - name: branches
  - name: users
  - name: clients
  - name: fund-products
  - name: loan-requests
  - name: loans
  - name: installments
  - name: payments
  - name: sales-agents
