kind = "web"
previewPath = "/"
title = "Neo FMC - Multi-tenant Microfinance SaaS"
version = "1.0.0"
id = "artifacts/neo-fmc"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 20678

[services.development]
run = "pnpm --filter @workspace/neo-fmc run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/neo-fmc", "run", "build" ]
publicDir = "artifacts/neo-fmc/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20678"
BASE_PATH = "/"
