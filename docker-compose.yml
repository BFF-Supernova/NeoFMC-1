version: "3.9"

services:
  postgres:
    image: postgres:15-alpine
    container_name: neo-fmc-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${PGUSER:-neo_fmc_user}
      POSTGRES_PASSWORD: ${PGPASSWORD:-neo_fmc_pass}
      POSTGRES_DB: ${PGDATABASE:-neo_fmc_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PGUSER:-neo_fmc_user} -d ${PGDATABASE:-neo_fmc_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: neo-fmc-api
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://${PGUSER:-neo_fmc_user}:${PGPASSWORD:-neo_fmc_pass}@postgres:5432/${PGDATABASE:-neo_fmc_db}
      JWT_SECRET: ${JWT_SECRET}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost,http://localhost:80}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      WEBHOOK_SECRET: ${WEBHOOK_SECRET:-}
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - uploads_data:/app/artifacts/api-server/uploads

  nginx:
    image: nginx:alpine
    container_name: neo-fmc-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certs:/etc/nginx/certs:ro
    depends_on:
      - api

volumes:
  postgres_data:
  uploads_data:
